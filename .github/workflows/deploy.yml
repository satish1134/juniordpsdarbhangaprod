name: Build and Deploy to Production VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ZOHO_SMTP_HOST: ${{ secrets.ZOHO_SMTP_HOST }}
          ZOHO_SMTP_PORT: ${{ secrets.ZOHO_SMTP_PORT }}
          ZOHO_SMTP_USER: ${{ secrets.ZOHO_SMTP_USER }}
          ZOHO_SMTP_PASS: ${{ secrets.ZOHO_SMTP_PASS }}
          ZOHO_SMTP_PASS_PRINCIPAL: ${{ secrets.ZOHO_SMTP_PASS_PRINCIPAL }}
          ZOHO_SMTP_PASS_INFO: ${{ secrets.ZOHO_SMTP_PASS_INFO }}
          ZOHO_SMTP_PASS_ACCOUNT: ${{ secrets.ZOHO_SMTP_PASS_ACCOUNT }}
          INBOUND_WEBHOOK_SECRET: ${{ secrets.INBOUND_WEBHOOK_SECRET }}
        with:
          host: 5.175.216.125
          port: 22125
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          envs: ADMIN_USERNAME,ADMIN_PASSWORD,JWT_SECRET,MONGO_URI,RESEND_API_KEY,SENDER_EMAIL,ADMIN_PATH,ADMIN_EMAIL,ZOHO_SMTP_HOST,ZOHO_SMTP_PORT,ZOHO_SMTP_USER,ZOHO_SMTP_PASS,ZOHO_SMTP_PASS_PRINCIPAL,ZOHO_SMTP_PASS_INFO,ZOHO_SMTP_PASS_ACCOUNT,INBOUND_WEBHOOK_SECRET
          script: |
            cd /opt/juniordps
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Securely initialize or update .env with injected secrets
            touch .env
            chmod 600 .env

            # Write or update configuration keys
            grep -q "^PORT=" .env && sed -i "s/^PORT=.*/PORT=3000/" .env || echo "PORT=3000" >> .env
            grep -q "^NODE_ENV=" .env && sed -i "s/^NODE_ENV=.*/NODE_ENV=production/" .env || echo "NODE_ENV=production" >> .env

            if [ -n "$ADMIN_USERNAME" ]; then
              grep -q "^ADMIN_USERNAME=" .env && sed -i "s|^ADMIN_USERNAME=.*|ADMIN_USERNAME=$ADMIN_USERNAME|" .env || echo "ADMIN_USERNAME=$ADMIN_USERNAME" >> .env
            else
              grep -q "^ADMIN_USERNAME=" .env || echo "ADMIN_USERNAME=admin" >> .env
            fi

            if [ -n "$ADMIN_PASSWORD" ]; then
              grep -q "^ADMIN_PASSWORD=" .env && sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env || echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
            fi

            if [ -n "$JWT_SECRET" ]; then
              grep -q "^JWT_SECRET=" .env && sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT_SECRET|" .env || echo "JWT_SECRET=$JWT_SECRET" >> .env
            fi

            if [ -n "$MONGO_URI" ]; then
              grep -q "^MONGO_URI=" .env && sed -i "s|^MONGO_URI=.*|MONGO_URI=$MONGO_URI|" .env || echo "MONGO_URI=$MONGO_URI" >> .env
            else
              grep -q "^MONGO_URI=" .env || echo "MONGO_URI=mongodb://root:jdpsSecurePass2026@mongodb:27017/juniordps?authSource=admin" >> .env
            fi

            if [ -n "$RESEND_API_KEY" ]; then
              grep -q "^RESEND_API_KEY=" .env && sed -i "s|^RESEND_API_KEY=.*|RESEND_API_KEY=$RESEND_API_KEY|" .env || echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env
            fi

            if [ -n "$SENDER_EMAIL" ]; then
              grep -q "^SENDER_EMAIL=" .env && sed -i "s|^SENDER_EMAIL=.*|SENDER_EMAIL=$SENDER_EMAIL|" .env || echo "SENDER_EMAIL=$SENDER_EMAIL" >> .env
            fi

            if [ -n "$ADMIN_PATH" ]; then
              CLEAN_ADMIN_PATH=$(echo "$ADMIN_PATH" | sed -E 's|^https?://[^/]+||' | sed -E 's|/login/?$||')
              [ -z "$CLEAN_ADMIN_PATH" ] && CLEAN_ADMIN_PATH="/manage-school-x92-secure"
              echo "$CLEAN_ADMIN_PATH" | grep -q "^/" || CLEAN_ADMIN_PATH="/$CLEAN_ADMIN_PATH"
              grep -q "^ADMIN_PATH=" .env && sed -i "s|^ADMIN_PATH=.*|ADMIN_PATH=$CLEAN_ADMIN_PATH|" .env || echo "ADMIN_PATH=$CLEAN_ADMIN_PATH" >> .env
            else
              grep -q "^ADMIN_PATH=" .env || echo "ADMIN_PATH=/manage-school-x92-secure" >> .env
            fi

            if [ -n "$ADMIN_EMAIL" ]; then
              grep -q "^ADMIN_EMAIL=" .env && sed -i "s|^ADMIN_EMAIL=.*|ADMIN_EMAIL=$ADMIN_EMAIL|" .env || echo "ADMIN_EMAIL=$ADMIN_EMAIL" >> .env
            fi

            # Zoho SMTP Credentials
            if [ -n "$ZOHO_SMTP_HOST" ]; then
              grep -q "^ZOHO_SMTP_HOST=" .env && sed -i "s|^ZOHO_SMTP_HOST=.*|ZOHO_SMTP_HOST=$ZOHO_SMTP_HOST|" .env || echo "ZOHO_SMTP_HOST=$ZOHO_SMTP_HOST" >> .env
            else
              grep -q "^ZOHO_SMTP_HOST=" .env || echo "ZOHO_SMTP_HOST=smtp.zoho.com" >> .env
            fi

            if [ -n "$ZOHO_SMTP_PORT" ]; then
              grep -q "^ZOHO_SMTP_PORT=" .env && sed -i "s|^ZOHO_SMTP_PORT=.*|ZOHO_SMTP_PORT=$ZOHO_SMTP_PORT|" .env || echo "ZOHO_SMTP_PORT=$ZOHO_SMTP_PORT" >> .env
            else
              grep -q "^ZOHO_SMTP_PORT=" .env || echo "ZOHO_SMTP_PORT=587" >> .env
            fi

            if [ -n "$ZOHO_SMTP_USER" ]; then
              grep -q "^ZOHO_SMTP_USER=" .env && sed -i "s|^ZOHO_SMTP_USER=.*|ZOHO_SMTP_USER=$ZOHO_SMTP_USER|" .env || echo "ZOHO_SMTP_USER=$ZOHO_SMTP_USER" >> .env
            fi

            if [ -n "$ZOHO_SMTP_PASS" ]; then
              grep -q "^ZOHO_SMTP_PASS=" .env && sed -i "s|^ZOHO_SMTP_PASS=.*|ZOHO_SMTP_PASS=$ZOHO_SMTP_PASS|" .env || echo "ZOHO_SMTP_PASS=$ZOHO_SMTP_PASS" >> .env
            fi

            if [ -n "$ZOHO_SMTP_PASS_PRINCIPAL" ]; then
              grep -q "^ZOHO_SMTP_PASS_PRINCIPAL=" .env && sed -i "s|^ZOHO_SMTP_PASS_PRINCIPAL=.*|ZOHO_SMTP_PASS_PRINCIPAL=$ZOHO_SMTP_PASS_PRINCIPAL|" .env || echo "ZOHO_SMTP_PASS_PRINCIPAL=$ZOHO_SMTP_PASS_PRINCIPAL" >> .env
            fi

            if [ -n "$ZOHO_SMTP_PASS_INFO" ]; then
              grep -q "^ZOHO_SMTP_PASS_INFO=" .env && sed -i "s|^ZOHO_SMTP_PASS_INFO=.*|ZOHO_SMTP_PASS_INFO=$ZOHO_SMTP_PASS_INFO|" .env || echo "ZOHO_SMTP_PASS_INFO=$ZOHO_SMTP_PASS_INFO" >> .env
            fi

            if [ -n "$ZOHO_SMTP_PASS_ACCOUNT" ]; then
              grep -q "^ZOHO_SMTP_PASS_ACCOUNT=" .env && sed -i "s|^ZOHO_SMTP_PASS_ACCOUNT=.*|ZOHO_SMTP_PASS_ACCOUNT=$ZOHO_SMTP_PASS_ACCOUNT|" .env || echo "ZOHO_SMTP_PASS_ACCOUNT=$ZOHO_SMTP_PASS_ACCOUNT" >> .env
            fi

            if [ -n "$INBOUND_WEBHOOK_SECRET" ]; then
              grep -q "^INBOUND_WEBHOOK_SECRET=" .env && sed -i "s|^INBOUND_WEBHOOK_SECRET=.*|INBOUND_WEBHOOK_SECRET=$INBOUND_WEBHOOK_SECRET|" .env || echo "INBOUND_WEBHOOK_SECRET=$INBOUND_WEBHOOK_SECRET" >> .env
            fi

            # Enable route_localnet so host localhost traffic cleanly routes to docker-proxy
            sysctl -w net.ipv4.conf.all.route_localnet=1 2>/dev/null || true
            sysctl -w net.ipv4.conf.default.route_localnet=1 2>/dev/null || true

            # Write authoritative docker-compose.prod.yml with persistent mongo_data and jdps_network
            echo "" | base64 -d > docker-compose.prod.yml

            echo "=== PULLING LATEST DOCKER IMAGE FROM GHCR ==="
            docker pull ghcr.io/satish1134/juniordpsdarbhangaprod:latest

            echo "=== CHECKING FOR RUNNING PM2 / NODE HOST PROCESSES ON 3000 ==="
            if command -v pm2 >/dev/null 2>&1; then
              echo "Stopping PM2 background processes to prevent port 3000 conflicts..."
              pm2 stop all 2>/dev/null || true
            fi

            echo "=== CLEANING UP TEMPORARY CONTAINERS & ENSURING MONGODB RUNS ==="
            docker stop juniordps_app juniordps_mongodb 2>/dev/null || true
            docker rm -f juniordps_app juniordps_mongodb 2>/dev/null || true
            docker compose -f docker-compose.prod.yml up -d mongodb
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-deps app
            docker image prune -f

            echo "=== RUNNING DOCKER CONTAINERS ==="
            docker ps || true
            echo "=== LISTENING PORTS ==="
            ss -tulpn 2>/dev/null || netstat -tulpn 2>/dev/null || true

            echo "=== WAITING AND VERIFYING CONTAINER HEALTH ==="
            for i in 1 2 3 4 5 6; do
              sleep 2
              HEALTH=$(curl -s http://5.175.216.125:3000/api/health || true)
              if echo "$HEALTH" | grep -q "official-mailbox"; then
                echo "✓ SUCCESS: New application container running with official-mailbox! Response: $HEALTH"
                break
              else
                echo "Attempt $i: Waiting for container to respond... got: $HEALTH"
              fi
            done

            echo "=== FAIL2BAN & FIREWALL AUDIT AND UNBAN ==="
            if command -v fail2ban-client >/dev/null 2>&1; then
              echo "Checking fail2ban status:"
              fail2ban-client status || true
              echo "Unbanning all banned IPs in fail2ban:"
              fail2ban-client unban --all 2>/dev/null || true
              # Stop any aggressive nginx filters that may ban client browsers on 401/404
              fail2ban-client stop nginx-http-auth 2>/dev/null || true
              fail2ban-client stop nginx-botsearch 2>/dev/null || true
              fail2ban-client stop nginx-limit-req 2>/dev/null || true
            fi

            if command -v ufw >/dev/null 2>&1; then
              ufw allow 80/tcp 2>/dev/null || true
              ufw allow 443/tcp 2>/dev/null || true
              ufw allow 22125/tcp 2>/dev/null || true
            fi

            # Configure Nginx virtual host for juniordpsdarbhanga.com and www.juniordpsdarbhanga.com
            echo "" | base64 -d > /etc/nginx/sites-available/juniordps

            mkdir -p /var/www/certbot/.well-known/acme-challenge /etc/nginx/sites-enabled
            chmod -R 777 /var/www/certbot
            ln -sf /etc/nginx/sites-available/juniordps /etc/nginx/sites-enabled/juniordps
            rm -f /etc/nginx/sites-enabled/default /etc/nginx/conf.d/default.conf 2>/dev/null || true

            # Auto-provision or renew Let's Encrypt SSL if domain resolves to 5.175.216.125
            DOMAINS=""
            if getent ahosts "juniordpsdarbhanga.com" 2>/dev/null | grep -q "5.175.216.125"; then
              DOMAINS="$DOMAINS -d juniordpsdarbhanga.com"
            fi
            if getent ahosts "www.juniordpsdarbhanga.com" 2>/dev/null | grep -q "5.175.216.125"; then
              DOMAINS="$DOMAINS -d www.juniordpsdarbhanga.com"
            fi

            if [ -n "$DOMAINS" ]; then
              echo "DNS is verified for domain(s): $DOMAINS. Setting up SSL certificates..."
              if ! command -v certbot >/dev/null 2>&1; then
                apt-get update -qq && apt-get install -y -qq certbot
              fi
              if [ ! -d "/etc/letsencrypt/live/juniordpsdarbhanga.com" ]; then
                echo "Stopping Nginx temporarily for Certbot standalone..."
                systemctl stop nginx 2>/dev/null || pkill -9 nginx 2>/dev/null || true
                sleep 2
                certbot certonly --standalone $DOMAINS --non-interactive --agree-tos --email sandyverma3@gmail.com || true
              fi

              # If certificate was issued, activate HTTPS in Nginx
              if [ -f "/etc/letsencrypt/live/juniordpsdarbhanga.com/fullchain.pem" ]; then
                echo "" | base64 -d > /etc/nginx/sites-available/juniordps
                nginx -t && (systemctl restart nginx 2>/dev/null || systemctl start nginx 2>/dev/null || (pkill -9 nginx 2>/dev/null; nginx))
                echo "✓ SSL Certificate successfully installed and Nginx reloaded for HTTPS!"
              else
                # Fallback start if cert failed
                nginx -t && (systemctl restart nginx 2>/dev/null || systemctl start nginx 2>/dev/null || (pkill -9 nginx 2>/dev/null; nginx))
              fi
            else
              echo "DNS for domain(s) has not yet propagated to 5.175.216.125. Starting Nginx on HTTP..."
              nginx -t && (systemctl restart nginx 2>/dev/null || systemctl start nginx 2>/dev/null || (pkill -9 nginx 2>/dev/null; nginx))
            fi

            echo "=== RECENT NGINX ERROR LOGS ==="
            tail -n 30 /var/log/nginx/error.log 2>/dev/null || true

            echo "=== TESTING NGINX AND UPSTREAM ==="
            sleep 3
            curl -I http://5.175.216.125:3000 || true
            curl -I https://juniordpsdarbhanga.com || true

