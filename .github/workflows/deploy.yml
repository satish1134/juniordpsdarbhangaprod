name: Build and Deploy to Production VPS

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          ADMIN_PATH: ${{ secrets.ADMIN_PATH }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        with:
          host: 5.175.216.125
          port: 22125
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          envs: ADMIN_USERNAME,ADMIN_PASSWORD,JWT_SECRET,MONGO_URI,RESEND_API_KEY,SENDER_EMAIL,ADMIN_PATH,ADMIN_EMAIL
          script: |
            cd /opt/juniordps
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Securely initialize or update .env with injected secrets
            touch .env
            chmod 600 .env

            # Write or update configuration keys
            grep -q "^PORT=" .env && sed -i "s/^PORT=.*/PORT=3000/" .env || echo "PORT=3000" >> .env
            grep -q "^NODE_ENV=" .env && sed -i "s/^NODE_ENV=.*/NODE_ENV=production/" .env || echo "NODE_ENV=production" >> .env

            if [ -n "$ADMIN_USERNAME" ]; then
              grep -q "^ADMIN_USERNAME=" .env && sed -i "s|^ADMIN_USERNAME=.*|ADMIN_USERNAME=$ADMIN_USERNAME|" .env || echo "ADMIN_USERNAME=$ADMIN_USERNAME" >> .env
            else
              grep -q "^ADMIN_USERNAME=" .env || echo "ADMIN_USERNAME=admin" >> .env
            fi

            if [ -n "$ADMIN_PASSWORD" ]; then
              grep -q "^ADMIN_PASSWORD=" .env && sed -i "s|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=$ADMIN_PASSWORD|" .env || echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> .env
            fi

            if [ -n "$JWT_SECRET" ]; then
              grep -q "^JWT_SECRET=" .env && sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$JWT_SECRET|" .env || echo "JWT_SECRET=$JWT_SECRET" >> .env
            fi

            if [ -n "$MONGO_URI" ]; then
              grep -q "^MONGO_URI=" .env && sed -i "s|^MONGO_URI=.*|MONGO_URI=$MONGO_URI|" .env || echo "MONGO_URI=$MONGO_URI" >> .env
            else
              grep -q "^MONGO_URI=" .env || echo "MONGO_URI=mongodb://mongodb:27017/juniordps" >> .env
            fi

            if [ -n "$RESEND_API_KEY" ]; then
              grep -q "^RESEND_API_KEY=" .env && sed -i "s|^RESEND_API_KEY=.*|RESEND_API_KEY=$RESEND_API_KEY|" .env || echo "RESEND_API_KEY=$RESEND_API_KEY" >> .env
            fi

            if [ -n "$SENDER_EMAIL" ]; then
              grep -q "^SENDER_EMAIL=" .env && sed -i "s|^SENDER_EMAIL=.*|SENDER_EMAIL=$SENDER_EMAIL|" .env || echo "SENDER_EMAIL=$SENDER_EMAIL" >> .env
            fi

            if [ -n "$ADMIN_PATH" ]; then
              CLEAN_ADMIN_PATH=$(echo "$ADMIN_PATH" | sed -E 's|^https?://[^/]+||' | sed -E 's|/login/?$||')
              [ -z "$CLEAN_ADMIN_PATH" ] && CLEAN_ADMIN_PATH="/manage-school-x92-secure"
              echo "$CLEAN_ADMIN_PATH" | grep -q "^/" || CLEAN_ADMIN_PATH="/$CLEAN_ADMIN_PATH"
              grep -q "^ADMIN_PATH=" .env && sed -i "s|^ADMIN_PATH=.*|ADMIN_PATH=$CLEAN_ADMIN_PATH|" .env || echo "ADMIN_PATH=$CLEAN_ADMIN_PATH" >> .env
            else
              grep -q "^ADMIN_PATH=" .env || echo "ADMIN_PATH=/manage-school-x92-secure" >> .env
            fi

            if [ -n "$ADMIN_EMAIL" ]; then
              grep -q "^ADMIN_EMAIL=" .env && sed -i "s|^ADMIN_EMAIL=.*|ADMIN_EMAIL=$ADMIN_EMAIL|" .env || echo "ADMIN_EMAIL=$ADMIN_EMAIL" >> .env
            fi

            # Ensure docker-compose.prod.yml connects the .env file to the app service
            if [ -f "docker-compose.prod.yml" ]; then
              if ! grep -q "env_file:" docker-compose.prod.yml; then
                sed -i '/app:/a \    env_file:\n      - .env' docker-compose.prod.yml
              fi
            fi

            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d app
            docker image prune -f

            # Configure Nginx virtual host for juniordpsdarbhanga.com and www.juniordpsdarbhanga.com
            echo "" | base64 -d > /etc/nginx/sites-available/juniordps

            mkdir -p /var/www/certbot /etc/nginx/sites-enabled
            ln -sf /etc/nginx/sites-available/juniordps /etc/nginx/sites-enabled/juniordps
            [ -f /etc/nginx/sites-enabled/default ] && rm -f /etc/nginx/sites-enabled/default
            nginx -t && (systemctl reload nginx 2>/dev/null || nginx -s reload 2>/dev/null || true)

            # Auto-provision or renew Let's Encrypt SSL if DNS resolves to 5.175.216.125
            RESOLVED=true
            for d in juniordpsdarbhanga.com www.juniordpsdarbhanga.com; do
              if ! getent ahosts "$d" 2>/dev/null | grep -q "5.175.216.125"; then
                RESOLVED=false
              fi
            done

            if [ "$RESOLVED" = "true" ]; then
              echo "DNS is verified for juniordpsdarbhanga.com. Checking SSL certificates..."
              if ! command -v certbot >/dev/null 2>&1; then
                apt-get update -qq && apt-get install -y -qq certbot python3-certbot-nginx
              fi
              if [ ! -d "/etc/letsencrypt/live/juniordpsdarbhanga.com" ]; then
                certbot --nginx -d juniordpsdarbhanga.com -d www.juniordpsdarbhanga.com --non-interactive --agree-tos --email sandyverma3@gmail.com --redirect || true
              fi
            else
              echo "DNS for juniordpsdarbhanga.com has not yet propagated to 5.175.216.125. Skipping Certbot until DNS is pointed."
            fi

