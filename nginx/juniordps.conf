# Nginx Virtual Host Configuration for Junior DPS Darbhanga
# Domains: juniordpsdarbhanga.com, www.juniordpsdarbhanga.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream jdps_upstream {
    server 5.175.216.125:3000;
    keepalive 32;
}

# Port 80 HTTP (ACME challenge + HTTP to HTTPS redirect + fallback proxy)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name juniordpsdarbhanga.com www.juniordpsdarbhanga.com 5.175.216.125 _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        if ($host ~* ^(juniordpsdarbhanga\.com|www\.juniordpsdarbhanga\.com)$) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://jdps_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 25M;
    }
}

# Port 443 HTTPS (With SSL certificate)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name juniordpsdarbhanga.com www.juniordpsdarbhanga.com 5.175.216.125 _;

    ssl_certificate /etc/letsencrypt/live/juniordpsdarbhanga.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/juniordpsdarbhanga.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Buffer & Timeout settings for Chrome/Edge stability
    large_client_header_buffers 4 32k;
    client_header_buffer_size 4k;
    keepalive_timeout 75s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://jdps_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 25M;
    }
}
